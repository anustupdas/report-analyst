# Annual Report Analyst API — non-secret settings.
# Secrets (DB credentials, AGENT_SECRET, INTERNAL_WORKFLOW_SECRET, API keys) live in .env.
# Relative paths resolve against apps/api/.

api.environment: development
api.hostName: 0.0.0.0
api.port: 8000
api.logLevel: info
api.webStaticDir: ../web
api.corsOrigins:
  - http://localhost:5173
  - http://127.0.0.1:5173
  - http://localhost:8000
  - http://127.0.0.1:8000

database.host: localhost
database.port: 5432
database.name: chat_project

storage.dataRoot: ../../data
storage.maxUploadBytes: 104857600
storage.allowedExtensions: [pdf, txt, png, jpg, jpeg, docx, pptx, md]

textExtraction.url: http://localhost:5000
textExtraction.useOcr: false
textExtraction.timeoutSeconds: 300

# Model name + dimension must match the chosen provider's vector table and
# the embedding-service route (API refuses to start on mismatch).
# provider=huggingface → /api/v1/embed_texts + document_chunk_embeddings_hf (768)
# provider=openai      → /api/v1/embeddings/openai + document_chunk_embeddings_openai (1536)
embedding.url: http://localhost:5100
embedding.timeoutSeconds: 120
embedding.provider: openai
embedding.modelName: text-embedding-3-small
embedding.dimension: 1536

# Structure-aware chunking (section > paragraph > sentence > word), measured in characters.
# ~2000 chars is ~450-550 gte tokens; chunks never exceed maxChars (model limit is 8192 tokens).
# Consecutive chunks in the same section share the last overlapSentences whole sentences.
chunking.targetChars: 2000
chunking.maxChars: 2500
chunking.overlapSentences: 2

vectorSearch.defaultLimit: 8
vectorSearch.maxLimit: 50

ingest.staleProcessingMinutes: 14

langgraph.url: http://localhost:8080
# Empty on the host: datapoints use langgraph.url. Docker sets LANGGRAPH_INTERNAL_URL.
langgraph.internalUrl: ""

# Document description (company name, report year, summary) from the first chunks.
# The prompt and its model live in src/chat_api/prompt/fallback_prompts/ingest/describe_document/main.py
# (Langfuse-compatible; later managed in Langfuse). Needs OPENAI_API_KEY in .env.
llm.summaryEnabled: true
llm.descriptionContextChunks: 10
llm.timeoutSeconds: 60

langfuse.tracing: true
langfuse.promptCacheTtlSeconds: 60
