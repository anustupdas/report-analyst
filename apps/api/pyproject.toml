[project]
name = "chat-api"
version = "0.1.0"
description = "Annual Report Analyst API: users, report projects, annual-report ingest and pgvector search."
authors = [{ name = "Anustup Das", email = "33954271+anustupdas@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "pgvector>=0.3.6",
    "pyyaml>=6.0.2",
    "openai>=2.0.0",
    "langfuse>=4.7.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
chat-api = "chat_api.run:run_cli"
run-cli = "chat_api.run:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
