[project]
name = "langgraph-server"
version = "0.1.0"
description = "Annual Report Analyst LangGraph supervisor: project-scoped RAG chat over pgvector."
authors = [{ name = "Anustup Das", email = "33954271+anustupdas@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "psycopg[binary,pool]>=3.2.0",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=2,<3",
    "langfuse>=4.7.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
langgraph-server = "langgraph_server.run:run_cli"
run-cli = "langgraph_server.run:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
